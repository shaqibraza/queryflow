services:
  postgres:
    image: postgres:17-alpine
    container_name: queryflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queryflow
      POSTGRES_PASSWORD: queryflow
      POSTGRES_DB: queryflow
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryflow -d queryflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
